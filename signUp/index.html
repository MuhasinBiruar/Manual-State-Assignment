<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-row items-center justify-center h-screen w-screen bg-gradient-to-r from-[#579ae8] via-[#b3b5d1] to-[#10cfe0] gap-2 p-4">
    <form id="signUpForm" class="flex flex-col gap-5 bg-white/25 p-6 rounded-lg shadow-lg drop-shadow-lg h-75 w-70 backdrop-blur-sm">
        <input type="text" id="username" placeholder="Username" class="border border-gray-300 rounded-md p-2" required>
        <input type="email" id="email" placeholder="Email" class="border border-gray-300 rounded-md p-2" required>
        <div class="relative">
            <input type="password" id="password" placeholder="Password" class="border border-gray-300 rounded-md p-2 w-full pr-10" required>
            <button type="button" id="togglePassword" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-800">
                👁️
            </button>
        </div>
        <button type="submit" 
                class="cursor-pointer hover:bg-blue-500 transition-all duration-300 ease-in-out rounded-lg 
                border-black border w-[30%] h-10 self-center">Sign Up</button>
    </form>
</body>
<script type="module" src="app.js"></script>
</html>
